- id: store_policy-024
  category: store_policy
  language: en
  question: "Where is your store located?"
  product_ids: []
  must_contain: []
  must_not_contain: ["street", "avenue", "St.", "floor", "opening hours"]
  expected_behavior: "The catalog has no physical address data. Bot should say this is an online store and must not invent an address, city or opening hours. May offer help with products (watches, sports accessories)"

- id: shipping-025
  category: shipping
  language: en
  question: "What are the delivery options?"
  product_ids: []
  must_contain: ["overnight", "1-2 business days", "1 month"]
  must_not_contain: ["DHL", "FedEx", "UPS", "free shipping", "pickup point"]
  expected_behavior: "The catalog only contains per-product shipping times: overnight, 1-2 business days, 3-5 business days, 1 week, 2 weeks, 1 month. Must not invent carriers, shipping costs, free shipping or pickup"
  
- id: store_policy-026
  category: store_policy
  language: en
  question: "Can I pay upon delivery?"
  product_ids: []
  must_contain: []
  must_not_contain: ["yes, you can pay upon delivery", "cash on delivery is available"]
  expected_behavior: "There is no payment method information in the catalog. Bot must not confirm or deny cash on delivery as a fact. Should say it doesn't have this information and suggest contacting customer support or checking the terms at checkout"

- id: store_policy-027
  category: store_policy
  language: en
  question: "How can I track my order?"
  product_ids: []
  must_contain: []
  must_not_contain: ["tracking number is", "has been shipped", "is on its way"]
  expected_behavior: "Bot has no access to orders. Must not invent an order status or tracking number. Should explain it can't see orders and point to customer support or the user's account / confirmation email"
 
- id: store_policy-028
  category: store_policy
  language: en
  question: "My order is broken, how can I return it?"
  product_ids: []
  must_contain: []
  must_not_contain: ["30 days", "14 days", "full refund", "free return", "return label"]
  expected_behavior: "User received a damaged item. Bot should express sympathy, must not invent a return policy (deadlines, conditions, refunds) and should point to customer support. Ideally advises keeping the item and packaging and taking photos of the damage"

- id: store_policy-029
  category: store_policy
  language: en
  question: "Can I cancel my order?"
  product_ids: []
  must_contain: []
  must_not_contain: ["has been cancelled", "I cancelled", "I have cancelled", "refund will be"]
  expected_behavior: "Bot has no access to orders and cannot cancel them. Must not claim it cancelled the order or invent cancellation terms. Should point to customer support" 

- id: store_policy-030
  category: store_policy
  language: en
  question: "replace my order"
  product_ids: []
  must_contain: []
  must_not_contain: ["has been replaced", "I replaced", "I have replaced", "replacement is on its way"]
  expected_behavior: "Ambiguous request: exchange of a damaged item, swap for another product, or order change. Bot should ask what exactly is meant, must not pretend it performed a replacement (no order access), and should point to customer support. If the user wants a different product, it can help pick one from the catalog" 

