# How to build/install this project (needed for `pip install -e .`)
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Project metadata and runtime dependencies
[project]
name = "ai-shopping-assistant-qa"
version = "0.1.0"
description = "QA automation framework for testing an LLM-powered shopping assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "requests>=2.32",       # HTTP calls to the Ollama API
    "python-dotenv>=1.0",   # loads variables from a local .env file
    "pyyaml>=6.0",
]

# Tools needed only for development and CI, not to run the bot
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

# Only `bot` is an installable Python package; other folders are data/tests/scripts
[tool.setuptools]
packages = ["bot"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "llm: calls the real LLM (slow, needs Ollama running); run with -m llm",
]
